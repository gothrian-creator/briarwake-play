<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/briarwake-play/favicon.svg" />
    <link rel="manifest" href="/briarwake-play/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/briarwake-play/icons/icon-192.png" />
    <meta name="theme-color" content="#121820" />
    <!-- Tablet / mobile: lock page scale; Phaser handles pinch zoom in-game -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Briarwake</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #121820;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* Safe areas: keep canvas (and dock) clear of notch / home indicator */
      #app {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100dvh;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
    </style>
    <script type="module" crossorigin src="/briarwake-play/assets/index-BXIfTgnI.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
